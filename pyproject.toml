[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kimp"
version = "0.1.0"
description = "업비트/빗썸 김프 아비트라지 봇 — P0 시세 파이프라인 (수집·이원 김프 엔진·저장·알림)"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.9",
  "PyYAML>=6.0",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
kimp-collect = "kimp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
