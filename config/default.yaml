# P0 수집기 설정. 수수료·출금비는 추정 초기값 — PLAN.md 실측 확인 항목과 함께 검증 후 갱신할 것.

# coins는 ①유니버스 자동 해석 실패 시 폴백 시드 ②바이비트·OKX 구독 목록으로 쓰인다
coins: [BTC, ETH, XRP, SOL, TRX, DOGE, ADA]

universe:
  mode: auto           # auto: 업비트/빗썸 KRW 전 종목 ∩ 바이낸스 USDT (T3 — 수집은 넓게)
  max_coins: 150       # 업비트 24h 거래대금 상위 기준 컷
  refresh_sec: 1800    # 신규 KRW 상장 감지 주기 (알림만, 편입은 재시작 시)
  include: []          # 강제 포함
  exclude: []          # 강제 제외 (수집 자체를 안 함)
  # V7 검증 결과 (verify_universe.py, 2026-08-28 전수 판정: 199심볼 중 13 차단):
  #  AI = 티커 충돌 (업비트 젠신/Gensyn ≠ 바이낸스 Sleepless AI)
  #  나머지 = 자산은 동일하나 전송 네트워크 불일치 (네이티브↔브릿지/ERC20, 체인 마이그레이션 등)
  #  수집·관측은 계속, 거래(페이퍼 포함)·기회 알림만 차단. 신규 상장 시 verify_universe.py 재실행
  trade_blocklist: [A, AI, CHZ, DOT, GAS, LSK, MOVE, MTL, NEO, QKC, SEI, SOPH, ZIL]

wallet_status:
  bithumb_poll_sec: 60 # T4 게이트 ① — 빗썸 public 입출금 상태 (업비트/해외는 P0.5, 읽기전용 키 필요)

domestic: [upbit, bithumb]
overseas: [binance, bybit, okx]
overseas_ref: binance        # 김프 계산의 해외 기준 거래소 (P0), best-of 확장은 추후

ladder_usd: [5000, 20000, 50000]   # 왕복 엣지를 계산할 명목 금액 사다리 (USD)

staleness:
  book_ms: 5000              # 이보다 오래된 호가는 김프 계산에서 제외
  fx_ms: 120000

engine:
  min_interval_ms: 200           # 코인당 김프 재계산 최소 간격 (탐지 <100ms 요건은 WS 푸시가 담당)
  usdt_fanout_interval_ms: 1000  # KRW-USDT 변동발 전 코인 재계산 주기 — 코인 자체 호가 이벤트는 min_interval_ms로 즉시 반응

# taker 수수료 추정 초기값. 등급·쿠폰에 따라 다름 → 실계정 값으로 교체 필수 (VERIFY)
fees:
  taker:
    upbit: 0.0005
    bithumb: 0.0025          # 쿠폰 적용 시 0.0004까지 내려감 — 실계정 값 확인
    binance: 0.001
    bybit: 0.001
    okx: 0.001

# 출금 수수료 플랫 추정 (USD 환산). 네트워크·거래소별 상이 → VERIFY 후 갱신
withdraw_fee_usd_est:
  default: 2.0
  USDT: 1.0                  # TRC20/SOL 기준 추정
  BTC: 15.0
  ETH: 3.0
  XRP: 0.2
  SOL: 0.05
  TRX: 1.0
  DOGE: 4.0
  ADA: 0.5

alerts:
  net_edge_threshold: 0.005  # 순엣지 0.5% 이상이면 알림
  cooldown_sec: 300          # (코인, 방향)별 쿨다운
  health_cooldown_sec: 600
  max_immediate_per_min: 6   # INFO 즉시 전송 분당 예산 — 초과분은 60초 다이제스트로 묶음

storage:
  root: data
  flush_rows: 20000
  flush_sec: 120                    # 파일 수 절감 (크래시 시 최대 2분치 유실 — 시세 데이터라 허용)
  book_snapshot_interval_ms: 10000  # 호가 스냅샷 저장 스로틀 (계산은 전 틱, 저장은 10초)
  premium_min_change: 0.0005        # 김프 틱 저장 게이트: 순엣지 5bp 이상 변할 때만 기록
  premium_heartbeat_ms: 30000       # 변화 없어도 30초마다 1행 (연속성 — 변화는 게이트가 즉시 잡음)
  retention_days:                   # janitor가 6시간마다 초과 파티션 삭제 → 총량 평형 보장
    default: 30
    premium: 21
    books: 3                        # 호가 원본은 디버깅용 롤링 윈도우만
    trades: 14

fx:
  poll_sec: 5
  # NOTE: 던어무 비공식 엔드포인트 (업비트 자체 UI가 쓰는 소스). T8에서 정식 소스 결정 전 임시.
  url: "https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWUSD"

telegram:
  enabled: true              # 토큰/챗ID는 환경변수 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID

# P2 페이퍼 트레이딩 — 주문·출금 없이 전체 사이클 시뮬레이션 (실제 자금 무관, API 키 불필요)
paper:
  enabled: true
  entry_threshold: 0.005     # 순엣지 0.5% 이상이면 진입
  max_edge: 0.05             # 초과분은 V7/V8 의심 — 진입 금지
  hedge_out: true            # OUT(역프)은 헤지 락 (§1.2 확정)
  transfer_minutes:          # 코인별 예상 전송시간 (P3에서 실측 분포로 대체)
    default: 15
    XRP: 4
    TRX: 4
    SOL: 4
    DOGE: 25
    BTC: 40
    ETH: 12
  risk:                      # T13 확정 수치 (운용자 승인 2026-08-28)
    cycle_cap_usd: 2000
    inflight_cap_usd: 6000
    per_coin_cap_usd: 3000
    hourly_entries: 10
    daily_loss_limit_usd: 300
    max_consecutive_failures: 3
