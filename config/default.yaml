# P0 수집기 설정. 수수료·출금비는 추정 초기값 — PLAN.md 실측 확인 항목과 함께 검증 후 갱신할 것.

# coins는 ①유니버스 자동 해석 실패 시 폴백 시드 ②바이비트·OKX 구독 목록으로 쓰인다
coins: [BTC, ETH, XRP, SOL, TRX, DOGE, ADA]

universe:
  mode: auto           # auto: 업비트/빗썸 KRW 전 종목 ∩ 바이낸스 USDT (T3 — 수집은 넓게)
  max_coins: 150       # 업비트 24h 거래대금 상위 기준 컷
  refresh_sec: 1800    # 신규 KRW 상장 감지 주기 (알림만, 편입은 재시작 시)
  include: []          # 강제 포함
  exclude: []          # 강제 제외 (수집 자체를 안 함)
  # V7 검증 결과 (verify_universe.py 2026-08-29, 빗썸 net_type 포함 레그별 판정):
  #  "COIN"=전역 차단(양쪽 레그 불가/충돌), "COIN@거래소"=해당 국내 레그만 차단
  #  AI=티커 충돌(젠신≠Sleepless AI), 나머지=네트워크 불일치. allowlist(data/verified_ok.json)와 병행:
  #  신규 상장은 verify 재실행 전까지 자동 차단. 재검증: scripts/verify_universe.py
  trade_blocklist: [AERO@bithumb, AI, ANIME@bithumb, ARB@bithumb, AWE@bithumb, CHIP@bithumb,
                    CHZ, DOT, G@bithumb, GAS, GMT@bithumb, HOME@bithumb, KAITO@bithumb,
                    KAT@bithumb, LSK@upbit, MEGA@bithumb, MIRA@bithumb, MOVE, MTL,
                    OP@bithumb, OPG@bithumb, QKC, SEI@upbit, SIGN@bithumb, SOPH@upbit,
                    VIRTUAL@bithumb, WCT@bithumb, ZIL, ZK@bithumb]

wallet_status:
  bithumb_poll_sec: 60 # T4 게이트 ① — 빗썸 public 입출금 상태 (그 외는 읽기전용 키 있을 때 자동 기동)
  upbit_poll_sec: 60
  binance_poll_sec: 60
  okx_poll_sec: 60
  bybit_poll_sec: 60

domestic: [upbit, bithumb]
overseas: [binance, bybit, okx]  # 김프는 (국내×해외) 전 조합으로 계산 (M1 다변화 — 라이브는 OKX 우선)

ladder_usd: [5000, 20000, 50000]   # 왕복 엣지를 계산할 명목 금액 사다리 (USD)

staleness:
  book_ms: 5000              # 이보다 오래된 호가는 김프 계산에서 제외
  fx_ms: 120000

engine:
  min_interval_ms: 200           # 코인당 김프 재계산 최소 간격 (탐지 <100ms 요건은 WS 푸시가 담당)
  usdt_fanout_interval_ms: 1000  # KRW-USDT 변동발 전 코인 재계산 주기 — 코인 자체 호가 이벤트는 min_interval_ms로 즉시 반응

# taker 수수료 — 실계정 값 (운용자 확인 2026-08-29: 빗썸 쿠폰 0.04%, 업비트 0.05%)
fees:
  taker:
    upbit: 0.0005
    bithumb: 0.0004
    binance: 0.001
    bybit: 0.001
    okx: 0.001

# 정률 출금 수수료 — OUT 사이클의 국내 코인 출금에 가산 (운용자 실측 2026-08-28: 빗썸 알트 다수 ~1%)
# 효과: 빗썸 OUT은 총엣지 ~1.5%+ 떠야 순엣지 0.5% 임계 통과. 코인별 실값 확인 시 override (VERIFY)
withdraw_fee_pct:
  bithumb:
    default: 0.01
    USDT: 0.0                # USDT 레일은 정액 (withdraw_fee_usd_est로 반영) — 리밸런싱 비용 과대평가 방지
  upbit:
    default: 0.0             # 업비트는 정액 위주 — 코인별 실값 확인 후 갱신

# 출금 수수료 플랫 추정 (USD 환산). 네트워크·거래소별 상이 → VERIFY 후 갱신
withdraw_fee_usd_est:
  default: 2.0
  USDT: 1.0                  # TRC20/SOL 기준 추정
  BTC: 15.0
  ETH: 3.0
  XRP: 0.2
  SOL: 0.05
  TRX: 1.0
  DOGE: 4.0
  ADA: 0.5

alerts:
  net_edge_threshold: 0.005  # 순엣지 0.5% 이상이면 알림
  cooldown_sec: 300          # (코인, 방향)별 쿨다운
  health_cooldown_sec: 600
  max_immediate_per_min: 6   # INFO 즉시 전송 분당 예산 — 초과분은 60초 다이제스트로 묶음

storage:
  root: data
  flush_rows: 20000
  flush_sec: 120                    # 파일 수 절감 (크래시 시 최대 2분치 유실 — 시세 데이터라 허용)
  book_snapshot_interval_ms: 10000  # 호가 스냅샷 저장 스로틀 (계산은 전 틱, 저장은 10초)
  premium_min_change: 0.0005        # 김프 틱 저장 게이트: 순엣지 5bp 이상 변할 때만 기록
  premium_heartbeat_ms: 30000       # 변화 없어도 30초마다 1행 (연속성 — 변화는 게이트가 즉시 잡음)
  retention_days:                   # janitor가 6시간마다 초과 파티션 삭제 → 총량 평형 보장
    default: 30
    premium: 21
    books: 3                        # 호가 원본은 디버깅용 롤링 윈도우만
    trades: 14

fx:
  poll_sec: 5
  # NOTE: 던어무 비공식 엔드포인트 (업비트 자체 UI가 쓰는 소스). T8에서 정식 소스 결정 전 임시.
  url: "https://quotation-api-cdn.dunamu.com/v1/forex/recent?codes=FRX.KRWUSD"

telegram:
  enabled: true              # 토큰/챗ID는 환경변수 TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID

# P2 페이퍼 트레이딩 — 주문·출금 없이 전체 사이클 시뮬레이션 (실제 자금 무관, API 키 불필요)
paper:
  enabled: true
  entry_threshold: 0.005     # 순엣지 0.5% 이상이면 진입
  max_edge: 0.05             # 초과분은 V7/V8 의심 — 진입 금지
  hedge_out: true            # OUT(역프)은 헤지 락 (§1.2 확정)
  transfer_minutes:          # 코인별 예상 전송시간 (P3에서 실측 분포로 대체)
    default: 15
    XRP: 4
    TRX: 4
    SOL: 4
    DOGE: 25
    BTC: 40
    ETH: 12
  risk:                      # T13 확정 수치 (운용자 승인 2026-08-28)
    cycle_cap_usd: 2000
    inflight_cap_usd: 6000
    per_coin_cap_usd: 3000
    hourly_entries: 10
    daily_loss_limit_usd: 300
    max_consecutive_failures: 3
  inventory:                 # §1.5 재고형 페이퍼 시뮬 — 전부 가상 (T18 재결정: 무헤지 실배치 철회, 측정만)
    enabled: true
    venues_usd: {upbit: 5000, bithumb: 5000, binance: 5000, bybit: 5000, okx: 5000}
    coins: [PROM, ONG]       # 재고를 둘 코인 (검증 레그에서만 실행됨 — verify 재실행 후 유효)
    dom_base_pct: 0.5        # 국내 배분 중 코인 재고 비율 (IN=국내 매도가 주 방향이라 높게)
    ovs_base_pct: 0.2        # 해외 배분 중 코인 재고 비율 (OUT 대비 소량)
    band_pct: 0.5            # 목표 −50%에서 진입 차단, −25%(밴드 절반)에서 리밸런싱 시뮬 발동
    slice_usd: 500           # 조각당 명목 (인계서 §2.10 — 얕은 호가 보호)
    slice_interval_sec: 5    # 같은 레그 재조각 최소 간격 (새 스냅샷 요구의 근사)
    entry_threshold: 0.005   # 순엣지(출금비 제외 — 재고 모드는 사이클에 전송이 없음) 임계

# 출금 게이트웨이 (§4.1 방어선 3~5) — P3에서 Live 백엔드로 전환, 그 전까지 정책·승인 UX 검증
withdrawals:
  mode: supervised           # supervised = 전 건 텔레그램 승인 (P3 초기 확정값)
  per_tx_usd_cap: 3000
  daily_usd_cap: 10000
  approval_timeout_sec: 600  # 무응답 = 거부
  allowlist: []              # P3 전 기입. 항목: {coin, from, to, address, network, memo?, extra?}
                             #   network = 출발 거래소 표기 (OKX "USDT-TRC20" / 업비트·빗썸 net_type "TRX")
                             #   extra   = 거래소별 추가 파라미터 (빗썸 트래블룰 필드 등 — V1 실측 후 기입)
                             # 예: {coin: PROM, from: okx, to: upbit, address: "0x..", network: "PROM-ERC20"}
                             # 거래소단 화이트리스트(방어선 1)와 1:1 이중 잠금

# 실거래 러너 (M3ⓔⓕ — §4.1 방어선 6 잠금 스택). mode: off | dry_run(시뮬 어댑터 리허설) | live
execution:
  mode: off                  # live는 .env LIVE_TRADING_ALLOWED=1 + /arm <코인> 까지 전부 있어야 발사
  routes: []                 # 라우트 allowlist — 예: [{coin: PROM, dom: upbit, ovs: okx, direction: in}]
  max_notional_usd: 100      # 사이클당 명목 상한 (최소 금액 실거래 — T13 cycle_cap와 min)
  max_cycles: 1              # 프로세스 생애 총 실행 상한 (첫 라이브 = 1사이클 후 자동 정지)
  entry_threshold: 0.005
  ioc_margin_pct: 0.002      # IOC 시장성 지정가 여유 = 슬리피지 상한 (T7)
  min_fill_pct: 0.10         # 매수 체결 10% 미만 → 반대매매 후 ABORT (T6 확정)
  order_timeout_sec: 10      # 초과 시 재주문 없이 client ID 재조회
  withdraw_buffer_pct: 0.005 # 출금 수량 = 가용 × (1−버퍼) — 출금 수수료 여유
  deposit_timeout_mult: 4    # 입금 대기 = 예상 전송시간 × 배수 (초과 = RECONCILE)
  arm_ttl_sec: 900           # /arm 유효 시간 (만료 = 자동 DISARM)
